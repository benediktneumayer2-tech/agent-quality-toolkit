name: aqt-trail
on:
  push:
    paths: ["aqt-trail/**", "aqt-spec/**"]
  pull_request:
    paths: ["aqt-trail/**", "aqt-spec/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: aqt-trail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../aqt-spec -e ".[test]"
      - name: Test
        run: python -m pytest -q
