catalogue: annex22-2025d
title: EU GMP Annex 22 — Artificial Intelligence (draft 2025)
licence: CC-BY-4.0
source:
  document: EudraLex Volume 4, Annex 22 Artificial Intelligence (new annex), drafted by the EMA GMDP Inspectors Working Group with PIC/S
  version: draft for stakeholder consultation, 7 July – 7 October 2025
  status: draft (not adopted as of 2026-10-22; numbering and the treatment of generative AI may change)
  consulted: "2026-10-22"
  basis: "Checked against the consultation draft https://health.ec.europa.eu/document/download/5f38a92d-bb8e-4264-8898-ea076e926db6_en?filename=mp_vol4_chap4_annex22_consultation_guideline_en.pdf. Paraphrased in own words; where an item groups clauses, its ID uses the section number."
items:
  - id: annex22-2025d:1
    clause: "1"
    title: Scope and human in the loop
    paraphrase: The annex covers static AI/ML models with deterministic output in critical GMP uses (direct impact on patient safety, product quality or data integrity); self-learning or probabilistic-output models, generative AI and LLMs are outside it and should not be used there. In non-critical uses, qualified, trained staff stay responsible for checking the output fits its intended use (human in the loop).
    supported_by: [quarantine.release, signoff.signature, change.review, sensei.owner-control, spec.human-check]
    user_must: Classify each agent use as critical or non-critical and keep agents out of critical GMP decisions.
    verified: true
  - id: annex22-2025d:3
    clause: "3.1-3.3"
    title: Intended use
    paraphrase: The model's intended use is described in detail from process knowledge, including the input sample space with its common and rare variations, limitations, erroneous or biased inputs and any subgroups. A process expert is responsible for the description and approves it before acceptance testing; for a human-in-the-loop use with reduced testing it also states the operator's responsibility.
    supported_by: [validate.protocol-lock]
    user_must: Write and approve the intended use of each detector or AI reviewer; aqt-validate only locks the text you give it in the protocol.
    verified: true
  - id: annex22-2025d:4
    clause: "4.1-4.3"
    title: Acceptance criteria
    paraphrase: A process expert defines case-specific test metrics (for example a confusion matrix, sensitivity, specificity or F1 score) and acceptance criteria for them, possibly per subgroup, and approves them before acceptance testing. The criteria must be at least as demanding as the known performance of the process the model replaces.
    supported_by: [validate.protocol-lock, validate.detector, validate.reviewer]
    user_must: Know the performance of the process the model replaces and set criteria at least that high.
    verified: true
  - id: annex22-2025d:6.2
    clause: "6.2-6.3"
    title: Test-data independence and identification
    paraphrase: When test data is split from a common pool, staff who develop the model never access it, it is protected by access control and an audit trail, and no copies exist outside its repository. Which data was used for testing, when and how many times is recorded.
    supported_by: [validate.protocol-lock, validate.detector]
    user_must: Keep test sets separate from training and tuning data.
    verified: true
  - id: annex22-2025d:7
    clause: "7.1-7.4"
    title: Test execution
    paraphrase: The test follows a plan approved beforehand (intended use, metrics and criteria, test data, test script, calculation of metrics) and shows that the model generalises to new data from its intended use, without over- or underfitting. Deviations from the plan, failed criteria or unused test data are documented, investigated and justified, and test documentation, data and access records are kept.
    supported_by: [validate.protocol-lock, validate.detector, validate.reviewer]
    user_must: Investigate and justify every deviation the report lists, and retain the test data and documentation.
    verified: true
  - id: annex22-2025d:8
    clause: "8.1-8.2"
    title: Explainability
    paraphrase: When models for critical GMP use are tested, the system records which features of the test data drove each classification or decision, for example with feature attribution or heat maps. Reviewing whether those features are relevant and appropriate is part of approving the test results.
    supported_by: [quarantine.cases]
    user_must: Treat detector evidence spans as triage aids, not as a full explanation.
    verified: true
  - id: annex22-2025d:9
    clause: "9.1-9.2"
    title: Confidence
    paraphrase: When a model that predicts or classifies data is tested, the system logs its confidence score for each outcome where applicable. Models have a suitable threshold, and a very low score should be considered for flagging the outcome as undecided instead of giving an unreliable result.
    supported_by: [quarantine.hold, validate.detector]
    verified: true
  - id: annex22-2025d:10
    clause: "10.1-10.5"
    title: Operation (change and configuration control, monitoring, human review)
    paraphrase: Before deployment the model, its system and the process come under change and configuration control; each change is assessed for retesting, a decision not to retest is fully justified, and unauthorised changes are detected. Performance and input-data drift are monitored regularly, and where the model feeds a human operator's decision and testing was reduced, records of that human review are kept.
    supported_by: [validate.qualification, spec.envelope, change.review, sensei.advice-ledger, capa.action]
    user_must: Record model and configuration versions and requalify after changes.
    verified: true
