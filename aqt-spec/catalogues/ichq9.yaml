catalogue: ichq9
title: ICH Q9(R1) Quality Risk Management (elements used by AQT)
licence: CC-BY-4.0
source:
  document: ICH Harmonised Guideline Q9(R1), Quality Risk Management
  version: Step 4, 18 January 2023
  status: guidance in force
  consulted: "2026-10-22"
  basis: "Checked against https://database.ich.org/sites/default/files/ICH_Q9%28R1%29_Guideline_Step4_2023_0126_0.pdf (ICH). Paraphrased in own words."
items:
  - id: ichq9:4.3
    clause: "4.3"
    title: Risk assessment
    paraphrase: Risk assessment starts from a clearly defined risk question, identifies the hazards, and analyses and evaluates the risks they pose.
    supported_by: [trail.review, quarantine.hold]
    user_must: Assess the risks of your agent use; AQT's risk queries and bands are starting points.
    verified: true
  - id: ichq9:4.4
    clause: "4.4"
    title: Risk control
    paraphrase: Risk control decides whether to reduce or accept risks, aiming at an acceptable level with effort proportional to the significance of the risk, and checks whether controls introduce new risks.
    supported_by: [quarantine.release, change.finish, signoff.approved-actions]
    verified: true
  - id: ichq9:4.6
    clause: "4.6"
    title: Risk review
    paraphrase: Risk management outputs are reviewed in the light of new knowledge and experience after planned and unplanned events, with a review frequency based on the level of risk.
    supported_by: [validate.qualification, capa.trends]
    verified: true
  - id: ichq9:5.1
    clause: "5.1"
    title: Formality in quality risk management
    paraphrase: Formality is a continuum; higher uncertainty, importance or complexity calls for more formal risk management, and resource constraints do not justify less formality.
    supported_by: []
    user_must: Choose how formal your agent risk management needs to be.
    verified: true
