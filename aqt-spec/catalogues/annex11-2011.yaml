catalogue: annex11-2011
title: EU GMP Annex 11 — Computerised Systems (2011)
licence: CC-BY-4.0
source:
  document: EudraLex Volume 4, Annex 11 Computerised Systems
  version: revision in force since 30 June 2011
  status: in force
  consulted: "2026-10-22"
  basis: "Checked against https://health.ec.europa.eu/system/files/2016-11/annex11_01-2011_en_0.pdf (EudraLex Volume 4). Paraphrased in own words; clause numbering of the 2011 text, which differs from the 2025 draft."
items:
  - id: annex11-2011:1
    clause: "1"
    title: Risk management
    paraphrase: Risk management is applied throughout the system life cycle, taking patient safety, data integrity and product quality into account; the extent of validation and data-integrity controls follows a justified, documented risk assessment.
    supported_by: []
    user_must: Perform and document the risk assessment for your use of agents and of AQT.
    verified: true
  - id: annex11-2011:4.1
    clause: "4.1-4.2"
    title: Validation documentation
    paraphrase: Validation documentation and reports cover the relevant life-cycle steps, with standards, protocols, acceptance criteria and records justified by risk assessment. They include change control records where applicable and reports on deviations observed during validation.
    supported_by: [change.plan-ledger, capa.intake, validate.detector]
    user_must: Keep the validation documentation of your system.
    verified: true
  - id: annex11-2011:4.4
    clause: "4.4"
    title: User requirements and traceability
    paraphrase: User requirements specifications describe the required functions, are based on documented risk assessment and GMP impact, and are traceable throughout the life cycle.
    supported_by: [change.trace-report]
    user_must: Maintain the user requirements and their IDs.
    verified: true
  - id: annex11-2011:4.7
    clause: "4.7"
    title: Test methods and scenarios
    paraphrase: Evidence of appropriate test methods and test scenarios is demonstrated, considering parameter limits, data limits and error handling. Automated test tools and test environments have documented assessments of their adequacy.
    supported_by: [change.receipts, validate.protocol-lock]
    user_must: Define the tests that make up your evidence.
    verified: true
  - id: annex11-2011:5
    clause: "5"
    title: Data
    paraphrase: Where systems exchange data electronically, built-in checks make sure the data is entered and processed correctly and securely.
    supported_by: [spec.canonical-hash, spec.conformance]
    user_must: Check imported data at interfaces you add.
    verified: true
  - id: annex11-2011:7.1
    clause: "7.1"
    title: Data storage
    paraphrase: Physical and electronic measures protect data from damage; stored data is checked for accessibility, readability and accuracy and stays accessible for the whole retention period.
    supported_by: [spec.checkpoint, trail.verify-export, trail.anchor]
    user_must: Check stored trails periodically.
    verified: true
  - id: annex11-2011:7.2
    clause: "7.2"
    title: Backups
    paraphrase: All relevant data is backed up regularly; backup integrity and accuracy and the ability to restore are verified during validation and then monitored periodically.
    supported_by: [trail.verify-export]
    user_must: Make backups and run restore tests.
    verified: true
  - id: annex11-2011:8.1
    clause: "8.1"
    title: Printouts
    paraphrase: Clear printed copies of electronically stored data can be obtained.
    supported_by: [trail.verify-export, signoff.signature]
    verified: true
  - id: annex11-2011:9
    clause: "9"
    title: Audit trails
    paraphrase: Based on a risk assessment, consideration is given to building in a system-generated audit trail of all GMP-relevant changes and deletions, and the reason for changing or deleting GMP-relevant data is documented. Audit trails can be made available and converted into a generally intelligible form, and they are reviewed regularly.
    supported_by: [trail.writer, spec.envelope, trail.review, trail.verify-export]
    user_must: Decide what is GMP-relevant and review the trail at a defined frequency.
    verified: true
  - id: annex11-2011:10
    clause: "10"
    title: Change and configuration management
    paraphrase: Changes to a computerised system, including its configuration, are made only in a controlled manner under a defined procedure.
    supported_by: [change.plan-ledger, change.reconcile-diff, capa.action]
    user_must: Put agent instructions, hooks and thresholds under your change procedure.
    verified: true
  - id: annex11-2011:11
    clause: "11"
    title: Periodic evaluation
    paraphrase: Systems are evaluated periodically to confirm they remain in a valid state and continue to meet GMP, considering for example functionality, deviations, incidents, upgrades, performance, security and validation status.
    supported_by: [validate.qualification, trail.review, capa.trends]
    user_must: Plan and perform periodic reviews.
    verified: true
  - id: annex11-2011:12.1
    clause: "12.1"
    title: Security
    paraphrase: Physical and/or logical controls restrict access to the computerised system to authorised persons.
    supported_by: [trail.writer, spec.human-check]
    user_must: Configure OS users, permissions and network exposure.
    verified: true
  - id: annex11-2011:12.4
    clause: "12.4"
    title: Identity of operators
    paraphrase: Data and document management systems capture who entered, changed, confirmed or deleted data, and when.
    supported_by: [spec.envelope, trail.writer]
    verified: true
  - id: annex11-2011:13
    clause: "13"
    title: Incident management
    paraphrase: Every incident, including but not limited to system failures and data errors, is reported and assessed; for a critical incident the root cause is determined and drives corrective and preventive actions.
    supported_by: [capa.intake, capa.investigation, capa.action]
    user_must: Define what counts as a critical incident.
    verified: true
  - id: annex11-2011:14
    clause: "14"
    title: Electronic signature
    paraphrase: Within the company, electronic signatures carry the same weight as handwritten ones, stay permanently linked to their record and show the time and date they were applied.
    supported_by: [signoff.signature, signoff.invalidation, spec.signature]
    user_must: State in your procedures that electronic signatures are binding.
    verified: true
  - id: annex11-2011:17
    clause: "17"
    title: Archiving
    paraphrase: Archived data is checked for accessibility, readability and integrity; before relevant changes to the system, the ability to retrieve the data is ensured and tested.
    supported_by: [trail.verify-export, spec.conformance, spec.checkpoint]
    user_must: Archive trails with keys and checkpoints and test retrieval.
    verified: true
