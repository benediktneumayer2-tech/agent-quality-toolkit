catalogue: ch4-2025d
title: EU GMP Chapter 4 — Documentation (revision draft 2025)
licence: CC-BY-4.0
source:
  document: EudraLex Volume 4, Part I, Chapter 4 Documentation, revision drafted by the EMA GMDP Inspectors Working Group with PIC/S
  version: draft for stakeholder consultation, 7 July – 7 October 2025
  status: draft (not adopted as of 2026-10-22; the 2011 text is in force; numbering may change)
  consulted: "2026-10-22"
  basis: "Checked against the consultation draft https://health.ec.europa.eu/document/download/fa336a6e-753b-46fc-b53b-9178bacd8878_en?filename=mp_vol4_chap4_consultation_guideline_en.pdf. Paraphrased in own words; where an item groups clauses, its ID uses the first clause."
items:
  - id: ch4-2025d:4.24
    clause: "4.24-4.25"
    title: Records produced with AI or other automated means
    paraphrase: The regulated user is accountable for the integrity of documents, records and data produced or processed with AI or other automated means such as validation scripts. Such automated support belongs in the pharmaceutical quality system, whether it runs on premises or as a hosted service.
    supported_by: [spec.envelope, trail.writer, signoff.signature, change.review, sensei.advice-ledger]
    user_must: Inventory the AI tools you use and name the accountable human for each record they produce.
    verified: true
  - id: ch4-2025d:4.63
    clause: "4.63, Table 1"
    title: ALCOA++ data integrity principles
    paraphrase: Paper and electronic records follow the ALCOA++ principles of Table 1, which add Traceable to ALCOA+. Attributable includes knowing who or which system performed a task and, for changes to records, who made them, when and why.
    supported_by: [spec.envelope, trail.alcoa]
    verified: true
  - id: ch4-2025d:4.64
    clause: "4.64-4.75"
    title: Signatures in GMP relevant documentation
    paraphrase: Signatures, on paper or electronic, identify the signer, carry date and time and a clear meaning such as review or approval, and are indisputable and traceable to the signer and the signed record. A signature policy names the authorised signers, and their role and qualification match the meaning of what they sign.
    supported_by: [signoff.signature, spec.signature, signoff.invalidation]
    verified: true
  - id: ch4-2025d:4.70
    clause: "4.70"
    title: Electronic signing of electronic records
    paraphrase: Records that exist electronically are signed electronically, and hybrid signing is to be avoided. Where paper and electronic signatures exist in parallel, the regulated user defines which one is the regulatory relevant signature.
    supported_by: [signoff.signature, spec.signature]
    user_must: Sign electronic records electronically; where a paper signature remains, define which signature counts and bind the paper page to the record (see annex11-2025d:13.9).
    verified: true
  - id: ch4-2025d:4.77
    clause: "4.77"
    title: Retention of batch documentation
    paraphrase: Batch documentation is kept for at least one year after the batch expires or five years after QP certification, whichever is longer, and for investigational products five years after the last trial that used the batch. Product-specific legislation may require longer periods.
    supported_by: [spec.checkpoint, trail.anchor]
    user_must: Set retention periods and reconcile them with data-protection minimisation.
    verified: true
