[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "aqt-spec"
version = "0.2.0"
description = "Evidence records for AI coding agents: specification, JSON Schemas, test vectors, GxP catalogues and the Python reference library (Agent Quality Toolkit)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Benedikt Neumayer" }]
keywords = ["ai-agents", "coding-agents", "quality-management", "gxp", "evidence", "audit-trail", "json-schema", "ed25519", "alcoa", "part-11", "annex-11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
test = ["pytest>=8", "jsonschema>=4.18", "pyyaml>=6", "hypothesis>=6.100"]  # hypothesis: property tests only

[project.urls]
Homepage = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/tree/main/aqt-spec"
Repository = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Documentation = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/docs/manual.md"
Changelog = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/aqt-spec/CHANGELOG.md"
Issues = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/issues"

[project.scripts]
aqt-evidence = "aqt_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_evidence"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aqt_evidence/_data/schemas"
"vectors" = "aqt_evidence/_data/vectors"
"catalogues/catalogues.json" = "aqt_evidence/_data/catalogues.json"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "vectors", "catalogues", "spec", "scripts", "tests", "docs", "examples",
           "crosswalk.md", "README.md", "CHANGELOG.md", "NOTICE", "LICENSE", "LICENSES"]

[tool.pytest.ini_options]
testpaths = ["tests"]
