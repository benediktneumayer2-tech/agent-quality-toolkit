[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aqt-validate"
version = "0.1.0"
description = "Validation of AI controls: detector calibration with exact bounds and AI reviewer qualification, with evidence records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Benedikt Neumayer" }]
dependencies = ["aqt-spec>=0.1"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]
# detector plugins from the aqt.detectors entry-point group (INTERFACES I8)
quarantine = ["aqt-quarantine>=0.1"]

[project.scripts]
aqt-validate = "aqt_validate.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
