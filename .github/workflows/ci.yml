name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      # setup-uv publishes no major tags since v8; v10.3.3 is an immutable release tag
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap, tmux and nftables for optional checks and the aqt-egress box
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux nftables
      - name: All package suites and the integration demo (aqt-egress on Python 3.12+ only)
        run: scripts/test_all.sh
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Built wheels in a fresh venv outside the checkout, the tools and the demo
        run: scripts/clean_install_check.sh
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: As the release build, in a throw-away copy - one version, README links for PyPI, build, twine check
        run: scripts/build_dist.sh "$RUNNER_TEMP/dist"
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in the third-party dependencies (all packages, all extras)
        run: |
          uv venv /tmp/audit
          uv pip install --python /tmp/audit/bin/python -e "./aqt-spec[schema,test]" -e "./aqt-trail[test]" \
            -e "./aqt-signoff[schema,test]" -e "./aqt-change[test]" -e "./aqt-sensei[test]" \
            -e "./aqt-quarantine[hf,test]" -e "./aqt-validate[test]" -e "./aqt-capa[test]" -e "./aqt-ui[test]" \
            -e "./aqt-cli[test]" -e "./aqt-egress[test]"
          # the aqt-* packages are editable and left out: they are this repository's own code
          uv pip freeze --python /tmp/audit/bin/python --exclude-editable > /tmp/audit-requirements.txt
          # tornado comes only with mitmproxy (aqt-egress), for mitmproxy's own web interface, which aqt-egress
          # never imports or starts; mitmproxy 12.3.1 pins tornado<=6.5.10, so 6.6 cannot be installed yet.
          # Remove these four ignores once mitmproxy allows tornado 6.6.1.
          uvx pip-audit@2.9.0 -r /tmp/audit-requirements.txt --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln GHSA-pcg2-g6cj-q92c --ignore-vuln GHSA-r4j5-9xpp-3985 --ignore-vuln GHSA-pw9p-v7r6-gx4p \
            --ignore-vuln GHSA-5cjw-f85j-cv6r
