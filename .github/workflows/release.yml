name: release
# All eleven packages and the desktop app are released together under one version. RELEASING.md has the setup and
# the steps.
# - Tag v<version> pushed: build, verify (a clean install from the built files), the desktop installers of every
#   platform job in desktop.yml, then a GitHub release with the built files, the installers, SHA256SUMS and the
#   CHANGELOG notes. Zenodo archives that release and gives it a DOI.
# - The desktop app's update manifest latest.json, signed with the updater key, comes only when the repository has
#   that key as the secret TAURI_SIGNING_PRIVATE_KEY; without it the release has none.
# - PyPI is off until the repository variable PUBLISH_PYPI is "true". Then the tag also goes to TestPyPI, a smoke
#   install from TestPyPI runs, and PyPI follows after the owner approves the `pypi` environment.
# - Run by hand (workflow_dispatch): a dry run that builds and verifies, with every release file as the artifact
#   release-files (and uploads to TestPyPI when PyPI is on).
# Every action is pinned to an exact release tag; each job has only the permissions it needs. PyPI uploads use
# trusted publishing (no stored credentials), except for the first one, which creates the projects (RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: One version for every package; on a tag push, the tag is v<version>
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="$(python3 scripts/check_versions.py --tag "$GITHUB_REF_NAME")"
          else
            version="$(python3 scripts/check_versions.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from every CHANGELOG (a dry run accepts sections still marked unreleased)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/release_notes.py "$VERSION" > release-notes.md
          else
            python3 scripts/release_notes.py "$VERSION" --allow-unreleased > release-notes.md
          fi
      - name: Build every package with its README links at the tag (or this commit), twine check
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/build_dist.sh dist --tag "$GITHUB_REF_NAME"
          else
            scripts/build_dist.sh dist
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: The built wheels in a fresh venv outside the checkout, every tool and the demo
        run: scripts/clean_install_check.sh --dist dist

  desktop:
    # the installers of every platform (desktop.yml), each smoke-tested, as the artifacts aqt-desktop-<platform>
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  release-files:
    # Every file of the release in one folder: the Python packages, every aqt-desktop-* artifact, latest.json (only
    # with the updater key) and SHA256SUMS. Only this job sees the updater key; the build jobs never do.
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: files
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: aqt-desktop-*
          path: files
          merge-multiple: true
      - name: The tauri CLI that signs the updates (the version the app is built with)
        working-directory: aqt-desktop
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Sign the updates and write latest.json (only with the updater key), SHA256SUMS of every file
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/desktop_release.py files --version "$VERSION" --tag-run
          else
            python3 scripts/desktop_release.py files --version "$VERSION"
          fi
          ls -l files
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: files/
          if-no-files-found: error

  testpypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agent-quality-toolkit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write          # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          # Only for the first release, which creates the projects (RELEASING.md): an API token in this environment's
          # secrets. Unset (the normal case), the action uses trusted publishing.
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          # TestPyPI never takes the same file twice: after a dry run of this version, the tag's run keeps those
          # files (the verify job has checked the tag's own files).
          skip-existing: true

  testpypi-smoke:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install agent-quality-toolkit from TestPyPI as a user would, and run it
        run: |
          set -euo pipefail
          packages=(agent-quality-toolkit aqt-spec aqt-trail aqt-signoff aqt-change aqt-sensei aqt-quarantine
                    aqt-validate aqt-capa aqt-ui aqt-egress)
          # Only the toolkit's own packages come from TestPyPI, as wheels without dependencies; everything else
          # comes from PyPI, so that nobody's upload to TestPyPI can stand in for a dependency. A fresh upload
          # can take a minute to show up in the index.
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -rf wheels
            if uvx pip@26.2.2 download -q --no-deps --only-binary :all: --index-url https://test.pypi.org/simple/ \
                --dest wheels "${packages[@]/%/==$VERSION}"; then
              break
            fi
            [ "$attempt" -lt 8 ] || exit 1
            sleep 30
          done
          ls wheels
          # the toolkit links every tool's command itself; aqt-egress, an optional extra, only when asked for
          uv tool install --find-links wheels "agent-quality-toolkit[egress]==$VERSION" --with-executables-from aqt-egress
          tool_bin="$(uv tool dir --bin)"
          export PATH="$tool_bin:$PATH"
          aqt --version
          aqt-toolkit --version
          for tool in aqt-evidence aqt-trail aqt-signoff aqt-change aqt-sensei aqt-quarantine aqt-validate aqt-capa \
                      aqt-ui aqt-egress; do
            "$tool" --help > /dev/null
          done
          aqt-evidence vectors

  pypi:
    if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'
    needs: [build, testpypi-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi                 # the owner is its required reviewer: nothing reaches PyPI without that approval
      url: https://pypi.org/project/agent-quality-toolkit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
          password: ${{ secrets.PYPI_API_TOKEN }}   # as above: set only for the first release

  github-release:
    if: github.event_name == 'push'
    needs: [build, verify, release-files]   # not on PyPI: the GitHub release (and with it the DOI) does not wait for it
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: files
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: .
      - name: GitHub release for the tag, with the packages, the installers, SHA256SUMS and the CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Agent Quality Toolkit $VERSION" --notes-file release-notes.md
