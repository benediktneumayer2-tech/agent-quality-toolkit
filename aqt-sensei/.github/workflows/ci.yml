name: aqt-sensei
on:
  push:
    paths: ["aqt-sensei/**", "aqt-spec/**"]
  pull_request:
    paths: ["aqt-sensei/**", "aqt-spec/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: aqt-sensei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../aqt-spec -e ".[test]"
      - name: Test (offline; real tmux/bwrap tests are opt-in via AQT_SENSEI_REAL=1)
        run: python -m pytest -q
