[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aqt-egress"
version = "0.1.0.dev0"
description = "Agent Quality Toolkit: outbound checkpoint for AI coding agents; every request leaves a box through one proxy and is recorded with the process that sent it"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Benedikt Neumayer" }]
dependencies = ["aqt-spec>=0.1", "mitmproxy>=12.2,<13"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18", "aqt-trail>=0.1"]  # records checked against the schemas, written through a real writer and verified

[project.scripts]
aqt-egress = "aqt_egress.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }
aqt-trail = { path = "../aqt-trail", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_egress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]   # a mitmproxy dependency, not ours
