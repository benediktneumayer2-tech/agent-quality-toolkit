[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "agent-quality-toolkit"
version = "0.3.0"
description = "Agent Quality Toolkit: quality management controls for AI coding agents, with the aqt command for guided setup, a one-screen status and every tool"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Benedikt Neumayer" }]
keywords = ["ai-agents", "coding-agents", "quality-management", "gxp", "audit-trail", "change-control", "electronic-signatures", "capa", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "aqt-spec[schema]>=0.3,<0.4",
    "aqt-trail>=0.3,<0.4",
    "aqt-signoff>=0.3,<0.4",
    "aqt-change>=0.3,<0.4",
    "aqt-sensei>=0.3,<0.4",
    "aqt-quarantine>=0.3,<0.4",
    "aqt-validate>=0.3,<0.4",
    "aqt-capa>=0.3,<0.4",
    "aqt-ui>=0.3,<0.4",
    "tzdata; sys_platform == 'win32'",    # Windows has no IANA time zones (aqt setup's time zone)
]

[project.optional-dependencies]
test = ["pytest>=8"]
egress = ["aqt-egress>=0.3,<0.4; python_version >= '3.12'"]   # the outbound checkpoint (Python 3.12+)

[project.urls]
Homepage = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Repository = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Documentation = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/docs/manual.md"
Changelog = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/aqt-cli/CHANGELOG.md"
Issues = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/issues"

[project.scripts]
aqt = "aqt_cli.cli:main"
aqt-toolkit = "aqt_cli.cli:main"      # the same command, where aqtinstall's aqt comes first on PATH
# The tools' own commands again, with the same entry points as their packages declare: `uv tool install` and
# `pipx install` link only the scripts of the package named, and the Claude Code hooks call aqt-trail,
# aqt-quarantine and aqt-change by name. aqt-egress is left to its own package: a script cannot depend on
# the [egress] extra (with a uv tool or pipx, it runs as `aqt egress`).
aqt-trail = "aqt_trail.cli:main"
aqt-signoff = "aqt_signoff.cli:main"
aqt-change = "aqt_change.cli:main"
aqt-sensei = "aqt_sensei.cli:main"
aqt-quarantine = "aqt_quarantine.cli:main"
aqt-validate = "aqt_validate.cli:main"
aqt-capa = "aqt_capa.cli:main"
aqt-ui = "aqt_ui.cli:main"
aqt-evidence = "aqt_evidence.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }
aqt-trail = { path = "../aqt-trail", editable = true }
aqt-signoff = { path = "../aqt-signoff", editable = true }
aqt-change = { path = "../aqt-change", editable = true }
aqt-sensei = { path = "../aqt-sensei", editable = true }
aqt-quarantine = { path = "../aqt-quarantine", editable = true }
aqt-validate = { path = "../aqt-validate", editable = true }
aqt-capa = { path = "../aqt-capa", editable = true }
aqt-ui = { path = "../aqt-ui", editable = true }
aqt-egress = { path = "../aqt-egress", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
