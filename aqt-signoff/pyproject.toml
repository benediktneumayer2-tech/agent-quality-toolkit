[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aqt-signoff"
version = "0.1.0"
description = "Agent Quality Toolkit: signatures with meaning bound to exact content, and approved actions that never retry blindly"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Benedikt Neumayer" }]
dependencies = ["aqt-spec>=0.1", "cryptography>=41"]

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
aqt-signoff = "aqt_signoff.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_signoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
