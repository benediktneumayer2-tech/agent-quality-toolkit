[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "aqt-signoff"
version = "0.2.0"
description = "Signatures with a stated meaning, bound to exact content, and approved agent actions that run once (Agent Quality Toolkit)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Benedikt Neumayer" }]
keywords = ["ai-agents", "coding-agents", "quality-management", "gxp", "electronic-signatures", "ed25519", "approval", "four-eyes", "part-11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["aqt-spec>=0.2,<0.3", "cryptography>=41", "tzdata; sys_platform == 'win32'"]   # Windows has no IANA time zones

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/tree/main/aqt-signoff"
Repository = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Documentation = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/docs/manual.md"
Changelog = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/aqt-signoff/CHANGELOG.md"
Issues = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/issues"

[project.scripts]
aqt-signoff = "aqt_signoff.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_signoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
