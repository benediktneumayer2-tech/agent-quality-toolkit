[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "aqt-change"
version = "0.3.0"
description = "Change control for AI coding agent work: hash-bound plans, tool-captured verification receipts, reviews and a release gate (Agent Quality Toolkit)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Benedikt Neumayer" }]
keywords = ["ai-agents", "coding-agents", "quality-management", "gxp", "change-control", "verification", "release-gate", "claude-code", "git-hooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["aqt-spec>=0.3,<0.4", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/tree/main/aqt-change"
Repository = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Documentation = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/docs/manual.md"
Changelog = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/aqt-change/CHANGELOG.md"
Issues = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/issues"

[project.scripts]
aqt-change = "aqt_change.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_change"]

[tool.pytest.ini_options]
testpaths = ["tests"]
