[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aqt-change"
version = "0.1.0"
description = "Change control and verification receipts for AI coding agent work: hash-reconciled plans, runner-captured receipts, scoped finish, reviews, approved-versus-actual reconciliation and a release gate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Benedikt Neumayer" }]
dependencies = ["aqt-spec>=0.1", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aqt-change = "aqt_change.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_change"]

[tool.pytest.ini_options]
testpaths = ["tests"]
