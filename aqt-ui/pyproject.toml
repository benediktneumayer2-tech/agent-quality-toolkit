[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "aqt-ui"
version = "0.3.0"
description = "Local web page for the person supervising AI coding agents: trail, quarantine, changes, signatures, CAPA and qualifications (Agent Quality Toolkit)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Benedikt Neumayer" }]
keywords = ["ai-agents", "coding-agents", "quality-management", "gxp", "dashboard", "review", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["aqt-spec>=0.3,<0.4", "aqt-trail>=0.3,<0.4"]

[project.optional-dependencies]
# Every view imports its package lazily; a missing one shows "not installed".
all = ["aqt-quarantine>=0.3,<0.4", "aqt-signoff>=0.3,<0.4", "aqt-change>=0.3,<0.4", "aqt-capa>=0.3,<0.4",
       "aqt-validate>=0.3,<0.4"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/tree/main/aqt-ui"
Repository = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit"
Documentation = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/docs/manual.md"
Changelog = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/blob/main/aqt-ui/CHANGELOG.md"
Issues = "https://github.com/benediktneumayer2-tech/agent-quality-toolkit/issues"

[project.scripts]
aqt-ui = "aqt_ui.cli:main"

[tool.uv.sources]
aqt-spec = { path = "../aqt-spec", editable = true }
aqt-trail = { path = "../aqt-trail", editable = true }
aqt-quarantine = { path = "../aqt-quarantine", editable = true }
aqt-signoff = { path = "../aqt-signoff", editable = true }
aqt-change = { path = "../aqt-change", editable = true }
aqt-capa = { path = "../aqt-capa", editable = true }
aqt-validate = { path = "../aqt-validate", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aqt_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
